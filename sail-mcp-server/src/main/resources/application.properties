# ── Dev profile (plaintext Kafka, e.g. in-cluster Strimzi) ──────────────────
# Activate: ./mvnw quarkus:dev   (default)
%dev.quarkus.http.port=8081
%dev.kafka.bootstrap.servers=sail-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

# ── prod-plain profile (plaintext Kafka, deployed on Kubernetes) ─────────────
# Activate: -Dquarkus.profile=prod-plain
# Bootstrap server overridden at deploy time via KAFKA_BOOTSTRAP_SERVERS env var
# or by setting kafka.bootstrap.servers in a ConfigMap / secret.
%prod-plain.kafka.bootstrap.servers=sail-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

# ── prod-tls profile (external Kafka with SSL/TLS mTLS) ──────────────────────
# Activate: -Dquarkus.profile=prod-tls
%prod-tls.kafka.bootstrap.servers=kafka-sebi-avat6ar.c.aivencloud.com:18981
%prod-tls.kafka.security.protocol=SSL
%prod-tls.kafka.ssl.protocol=TLS
%prod-tls.kafka.ssl.key.password=safePassword123
%prod-tls.kafka.ssl.keystore.location=/etc/certs/client.keystore.p12
%prod-tls.kafka.ssl.keystore.password=safePassword123
%prod-tls.kafka.ssl.keystore.type=PKCS12
%prod-tls.kafka.ssl.truststore.location=/etc/certs/client.truststore.jks
%prod-tls.kafka.ssl.truststore.password=safePassword123
%prod-tls.kafka.ssl.truststore.type=JKS

# ── Kubernetes manifest generation (TLS mode only) ───────────────────────────
# These lines add the certs volume to the generated kubernetes.yml.
# Only include them when building for the prod-tls profile.
%prod-tls.quarkus.kubernetes.mounts.certs-volume.path=/etc/certs
%prod-tls.quarkus.kubernetes.secret-volumes.certs-volume.secret-name=agents-kafka-secrets
%prod-tls.quarkus.kubernetes.secret-volumes.certs-volume.items.keystore.path=client.keystore.p12
%prod-tls.quarkus.kubernetes.secret-volumes.certs-volume.items.truststore.path=client.truststore.jks