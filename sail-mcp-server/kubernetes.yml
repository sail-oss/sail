---
apiVersion: v1
kind: Service
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.30.6
    app.quarkus.io/build-timestamp: 2026-01-13 - 13:55:24 +0000
  labels:
    app.kubernetes.io/name: sail-mcp-server
    app.kubernetes.io/version: 1.0.0-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: sail-mcp-server
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: sail-mcp-server
    app.kubernetes.io/version: 1.0.0-SNAPSHOT
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.30.6
    app.quarkus.io/build-timestamp: 2026-01-13 - 13:55:24 +0000
  labels:
    app.kubernetes.io/name: sail-mcp-server
    app.kubernetes.io/version: 1.0.0-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: sail-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sail-mcp-server
      app.kubernetes.io/version: 1.0.0-SNAPSHOT
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.30.6
        app.quarkus.io/build-timestamp: 2026-01-13 - 13:55:24 +0000
      labels:
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: sail-mcp-server
        app.kubernetes.io/version: 1.0.0-SNAPSHOT
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_HTTP_CORS_ENABLED
              value: "true"
            - name: QUARKUS_PROFILE
              value: prod-plain  
          image: docker.io/sebi2706/sail-mcp-server:0.3
          imagePullPolicy: Always
          name: sail-mcp-server
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/certs
              name: certs-volume
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            defaultMode: 420
            items:
              - key: keystore
                path: client.keystore.p12
              - key: trustore
                path: client.truststore.jks
            # Set optional: true when deploying against a plaintext (non-TLS) Kafka cluster.
            # The pod will start normally even if the secret does not exist.
            optional: false
            secretName: agents-kafka-secrets
